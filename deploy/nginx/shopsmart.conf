# ShopSmart single-host layout (EC2): nginx is the ONLY public entry point.
#   :80  public -> redirects to HTTPS (and answers certificate renewals)
#   :443 public -> serves the React build and proxies /api/ to Express
#   :3000 internal -> Express, bound to 127.0.0.1 (HOST=127.0.0.1), never opened in the security group
#   :5432 internal -> PostgreSQL, localhost only, never opened in the security group
# Replace __DOMAIN__ (setup-ec2.sh does this automatically).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Short HSTS for a temporary classroom demo.
    add_header Strict-Transport-Security "max-age=86400" always;

    root  /var/www/shopsmart;
    index index.html;
    client_max_body_size 200k;

    # Express API (same origin as the frontend, so no CORS or cross-site cookies are needed).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Hashed Vite assets can be cached; a missing asset is a real 404.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page-app rewrite: a direct visit or refresh of /account, /orders/12, etc.
    # returns index.html and React Router renders the route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
