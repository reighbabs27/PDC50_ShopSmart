# Stage 1 (before a certificate exists): answer only Let's Encrypt HTTP challenges.
# The app is NOT served over plain HTTP, so no sign-in form is ever exposed without TLS.
# setup-ec2.sh replaces __DOMAIN__ and swaps this file for shopsmart.conf after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "ShopSmart is being configured for HTTPS.\n";
    }
}
